# 1. 定義這個工作流的名稱
name: My First CI Pipeline

# 2. 設定觸發條件：當有人 push 程式碼到 main 分支時就啟動
on:
  push:
    branches: [ main ]

# 3. 定義要做哪些事情（Jobs）
jobs:
  run-tests:
    # 指定執行環境（使用 GitHub 提供的 Ubuntu 虛擬機）
    runs-on: ubuntu-latest

    # 具體的執行步驟
    steps:
      # 步驟一：複製（Checkout）專案程式碼到虛擬機中
      - name: Check out repository code
        uses: actions/checkout@v4

      # 步驟二：模擬執行測試指令
      - name: Run test script
        run: |
          echo "正在安裝相依套件..."
          echo "正在執行單元測試..."
          echo "測試成功通過！"
